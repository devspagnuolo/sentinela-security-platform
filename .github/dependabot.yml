version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (usado por eslint-config-next) suporta apenas TypeScript < 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # eslint-plugin-react, -import e -jsx-a11y ainda exigem ESLint 9.
      - dependency-name: eslint
        versions: [">=10.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/, /deploy]
    schedule:
      interval: weekly
    ignore:
      # Mantém Node 22 LTS e PostgreSQL 16 até uma migração planejada.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
